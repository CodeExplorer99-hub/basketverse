<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Prova vibrazione</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 20px 16px 40px; background: #0b0f17; color: #e8edf5;
         font: 17px/1.45 system-ui, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 8px 0; color: #aab4c4; }
  .griglia { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0; }
  button { font: 600 20px system-ui, sans-serif; padding: 22px 8px; border: 0; border-radius: 14px;
           background: #ff7a1a; color: #1a0d00; }
  button:active { background: #ffb37a; }
  button.app { background: #3aa0ff; color: #001426; }
  #stato { background: #151b27; border-radius: 12px; padding: 12px 14px; font-size: 15px;
           color: #cfd8e6; white-space: pre-line; }
  h2 { font-size: 17px; margin: 22px 0 0; }
</style>
</head>
<body>
<h1>Prova vibrazione</h1>
<p>Premi i pulsanti dal più corto al più lungo e guarda da quale numero in su senti vibrare il telefono.</p>

<h2>Metodo del sito (Chrome)</h2>
<div class="griglia" id="web"></div>

<div id="blocco-app" hidden>
  <h2>Metodo dell'app Android</h2>
  <div class="griglia" id="app"></div>
</div>

<div id="stato"></div>
<p>Se non senti nemmeno 500 e 1000: controlla che il telefono non sia in Silenzioso, Non disturbare o Risparmio energetico.</p>

<script>
(function () {
  var DURATE = [12, 40, 80, 150, 300, 500, 1000];
  var stato = document.getElementById("stato");
  var haWeb = typeof navigator.vibrate === "function";
  var nativo = window.BVNative || null;
  var ultimo = "nessun pulsante premuto";

  function scrivi() {
    stato.textContent =
      "Vibrazione del browser: " + (haWeb ? "presente" : "ASSENTE") + "\n" +
      "Ponte dell'app Android: " + (nativo ? "presente" : "assente (normale in Chrome)") + "\n" +
      "Ultima prova: " + ultimo;
  }

  function pulsante(dove, ms, classe, azione) {
    var b = document.createElement("button");
    b.textContent = ms + " ms";
    if (classe) b.className = classe;
    b.addEventListener("click", function () {
      var esito;
      try { esito = azione(ms); } catch (e) { esito = "errore: " + e.message; }
      ultimo = ms + " ms → " + esito;
      scrivi();
    });
    dove.appendChild(b);
  }

  var web = document.getElementById("web");
  DURATE.forEach(function (ms) {
    pulsante(web, ms, "", function (d) {
      if (!haWeb) return "il browser non ha la vibrazione";
      return navigator.vibrate(d) ? "richiesta accettata" : "RIFIUTATA dal browser";
    });
  });

  if (nativo) {
    document.getElementById("blocco-app").hidden = false;
    var app = document.getElementById("app");
    DURATE.forEach(function (ms) {
      pulsante(app, ms, "app", function (d) { nativo.pulse(d); return "inviata all'app"; });
    });
  }
  scrivi();
})();
</script>
</body>
</html>
